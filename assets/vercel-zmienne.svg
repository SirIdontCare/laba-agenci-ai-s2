<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Etap 7: osobno nazwa, osobno wartość</title><desc id="desc">Schemat poglądowy do instrukcji kursu LABA. Wygląd programu może zależeć od wersji.</desc><rect width="1000" height="560" rx="20" fill="#f2f5f9"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="38" y="50" font-size="26" font-weight="700" fill="#162238">Etap 7: osobno nazwa, osobno wartość</text><rect x="38" y="80" width="924" height="330" rx="12" fill="#fff" stroke="#ccd5e1"/><text x="62" y="116" font-size="20" fill="#526077" font-weight="400">Environment Variables — przykład dla wyboru modelu</text><text x="62" y="160" font-size="18" fill="#526077" font-weight="400">Name / Key</text><rect x="62" y="177" width="876" height="58" rx="12" fill="#f7f9fc" stroke="#ccd5e1"/><text x="81" y="215" font-size="25" fill="#162238" font-weight="700">OPENROUTER_MODEL</text><text x="62" y="272" font-size="18" fill="#526077" font-weight="400">Value</text><rect x="62" y="289" width="876" height="58" rx="12" fill="#f7f9fc" stroke="#ccd5e1"/><text x="81" y="327" font-size="25" fill="#162238" font-weight="700">openai/gpt-6-luna</text><text x="62" y="382" font-size="21" fill="#162238" font-weight="400">Środowisko: Production dla głównego linku</text><rect x="38" y="430" width="924" height="67" rx="12" fill="#e3f4ec" stroke="none"/><text x="62" y="471" font-size="21" fill="#15563b" font-weight="700">Zapisz. Jeśli strona była już wdrożona, wykonaj Redeploy.</text><text x="38" y="535" font-size="15" fill="#526077">Schemat poglądowy. Nazwy i wygląd elementów mogą zależeć od wersji programu.</text></g></svg>
