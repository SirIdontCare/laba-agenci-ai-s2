<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">Etap 3: sprawdź folder i czynność</title><desc id="desc">Schemat poglądowy do instrukcji kursu LABA. Wygląd programu może zależeć od wersji.</desc><rect width="1000" height="550" rx="20" fill="#f2f5f9"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="38" y="50" font-size="26" font-weight="700" fill="#162238">Etap 3: sprawdź folder i czynność</text><rect x="38" y="80" width="924" height="110" rx="12" fill="#fff" stroke="#ccd5e1"/><text x="62" y="115" font-size="18" fill="#526077" font-weight="400">1. Folder asystenta</text><text x="62" y="153" font-size="24" fill="#162238" font-weight="700">C:\Users\Ala\projekty\moj-agent</text><rect x="38" y="210" width="924" height="150" rx="12" fill="#fff" stroke="#ccd5e1"/><text x="62" y="246" font-size="18" fill="#526077" font-weight="400">2. Asystent proponuje zapis pliku</text><text x="62" y="286" font-size="23" fill="#162238" font-weight="700">Utworzyć gotowosc.txt w folderze moj-agent</text><text x="62" y="326" font-size="19" fill="#162238" font-weight="400">To plik kontrolny z tej instrukcji.</text><rect x="38" y="380" width="924" height="105" rx="12" fill="#e3f4ec" stroke="none"/><text x="62" y="419" font-size="22" fill="#15563b" font-weight="700">3. Potwierdź tę czynność w narzędziu.</text><text x="62" y="453" font-size="20" fill="#15563b" font-weight="400">Po zapisie otwórz folder i sprawdź, czy plik naprawdę istnieje.</text><text x="38" y="525" font-size="15" fill="#526077">Schemat poglądowy. Nazwy i wygląd elementów mogą zależeć od wersji programu.</text></g></svg>
