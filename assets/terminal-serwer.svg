<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">Etap 4: serwer działa — otwórz podany adres</title><desc id="desc">Schemat poglądowy do instrukcji kursu LABA. Wygląd programu może zależeć od wersji.</desc><rect width="1000" height="550" rx="20" fill="#f2f5f9"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="38" y="50" font-size="26" font-weight="700" fill="#162238">Etap 4: serwer działa — otwórz podany adres</text><rect x="38" y="80" width="924" height="245" rx="12" fill="#152136" stroke="none"/><text x="62" y="119" font-size="18" fill="#b9c9df" font-weight="400">PowerShell — folder aplikacji</text><text x="62" y="164" font-size="21" fill="#fff" font-weight="400">PS C:\Users\Ala\projekty\moj-agent&gt; npm.cmd run dev</text><text x="62" y="221" font-size="25" fill="#84dfbb" font-weight="700">Local:  http://localhost:3000</text><text x="62" y="269" font-size="21" fill="#fff" font-weight="400">Ready — strona jest gotowa</text><rect x="38" y="345" width="924" height="140" rx="12" fill="#fff" stroke="#ccd5e1"/><text x="62" y="382" font-size="22" fill="#162238" font-weight="700">Otwórz adres z terminala w przeglądarce.</text><text x="62" y="418" font-size="19" fill="#162238" font-weight="400">U Ciebie port może być inny, np. 3001. Użyj swojego adresu.</text><text x="62" y="453" font-size="19" fill="#162238" font-weight="400">To okno zostaw otwarte. Inne komendy wpisuj w drugim oknie.</text><text x="38" y="525" font-size="15" fill="#526077">Schemat poglądowy. Nazwy i wygląd elementów mogą zależeć od wersji programu.</text></g></svg>
